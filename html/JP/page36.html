<h2><i>Pong</i>ゲーム</h2>
</div>
<div class="section two-column">
<div class="column-left">
<p>スプライトを使ったもう一つの楽しいゲームです！これは古典的なゲーム<i>Pong</i>を、2人用ではなく1人用に作りかえたものです。上下の矢印キー（または、これも、持っていればゲームコントローラー）を使ってパドルを動かしましょう。できるだけ長くボールを画面の中に保ってください！</p>
</div>
<div class="column-right">
<p><code>//</code>で始まる行（このプログラムの2行目のような行）は<b>コメント</b>と呼ばれます。コメントは、あなたや私のような、コードを読む人間のために書かれたちょっとしたメモです。31行目のように、行の終わりにコメントを置くこともできます。Mini Microは<code>//</code>から行の終わりまでをすべて無視します。</p>
</div>
